# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.android=true
kotlin.incremental.useClasspathSnapshot=true

# Compose
android.compose.compiler.version=1.5.11

# Version catalog
libs.versions.toml.update=never

# Build performance
android.nonTransitiveRClass=true
android.bundle.enableUncompressedNativeLibs=false
android.defaults.buildfeatures.buildconfig=true

# Namespace
android.namespace=com.phonerepair.shop

# Enable new feature flags
android.experimental.enabled=true
android.experimental.caching.commonResources=true