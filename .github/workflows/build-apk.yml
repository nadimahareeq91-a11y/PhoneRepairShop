name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/build-debug.log; exit ${PIPESTATUS[0]}

    - name: Publish Build Log
      if: always()
      continue-on-error: true
      run: |
        set -x
        mkdir -p ci-logs
        cp /tmp/build-debug.log ci-logs/build-debug.txt
        git config user.email "actions@github.com"
        git config user.name "github-actions"
        git add -f ci-logs/build-debug.txt
        git commit -m "ci: build log" --allow-empty
        git push origin HEAD:refs/heads/main

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: ci-logs/build-debug.txt

    - name: Upload APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: PhoneRepairShop-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk