name: Build Debug APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:  # يدوي من GitHub Actions tab

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout الكود
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد JDK 17
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. إعداد Android SDK
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26b
          cmdline-tools-version: latest
          build-tools-version: 34.0.0

      # 4. Cache Gradle
      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. جعل gradlew قابل للتنفيذ
      - name: 🔧 Make Gradle Executable
        run: chmod +x ./gradlew

      # 6. بناء Debug APK
      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 7. رفع الـ APK كـ Artifact
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneRepairShop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          compression-level: 0

      # 8. رفع ملف Mapping للـ ProGuard (للتصحيح)
      - name: 📤 Upload Mapping File
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapping-file
          path: app/build/outputs/mapping/debug/mapping.txt
          retention-days: 7

  # Job إضافي للنسخة النهائية (عند إصدار tag)
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 Setup Android SDK
        uses: actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26b
          cmdline-tools-version: latest
          build-tools-version: 34.0.0

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Make Gradle Executable
        run: chmod +x ./gradlew

      # بناء Release APK (يتطلب Keystore - siehe secrets)
      - name: 🔨 Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneRepairShop-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          compression-level: 0

      # إنشاء GitHub Release تلقائياً
      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}